name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias mínimas para tests
        run: pip install pytest httpx fastapi pillow
      - name: Syntax check de los archivos críticos
        run: python -m py_compile api_eva.py eva_v2.py orchestrator.py billing.py eva/tools.py
      - name: Tests
        run: python -m pytest tests/ -q
        # Nota: tests que requieren módulos pesados (torch, cv2) se marcan skip
        # via importorskip si se añaden en el futuro.
