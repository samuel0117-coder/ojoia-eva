<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI Dashboard v4</title>
<script>window.APP_VERSION='v4_fixed';</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,monospace;background:#0f0f0f;color:#e0e0e0;padding:12px}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{text-align:center;color:#0ff;font-size:1.2em;border-bottom:1px solid #333;padding-bottom:8px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:14px}
.card h2{font-size:0.9em;color:#0ff;margin-bottom:8px}
label{display:block;font-size:0.75em;color:#aaa;margin-bottom:3px}
input,textarea,select{width:100%;background:#111;border:1px solid #333;color:#e0e0e0;padding:6px;border-radius:3px;font-family:inherit;font-size:0.8em}
textarea{resize:vertical;min-height:40px}
input[type=file]{padding:5px}
button{background:#0ff;color:#000;border:none;padding:6px 16px;border-radius:3px;font-weight:bold;cursor:pointer;font-size:0.8em;margin-top:4px;margin-right:3px}
button:hover{background:#3ff}
button:disabled{opacity:0.4;cursor:not-allowed}
button.danger{background:#f44;color:#fff}
button.danger:hover{background:#f66}
.row{display:flex;gap:4px;align-items:flex-end}
.row *{flex:1}
.result{background:#111;border:1px solid #333;border-radius:3px;padding:8px;font-size:0.75em;white-space:pre-wrap;min-height:25px;max-height:150px;overflow:auto;margin-top:4px}
.error{color:#f44}
.ok{color:#0f0}
.gpu{font-size:0.65em;color:#666}
.status{display:flex;justify-content:space-between;background:#111;border:1px solid #333;border-radius:3px;padding:6px 10px;font-size:0.7em}
.on{color:#0f0}.off{color:#f44}
</style>
</head>
<body>
<div class="container">
<h1>🧪 AI Dashboard</h1>

<div class="status">
  <span>GPU: <span id="gpu-mem" class="on">...</span></span>
  <span>Modelo: <span id="gpu-model">ninguno</span></span>
  <span>ComfyUI: <span id="comfy-status" class="off">...</span></span>
</div>

<div class="card">
  <h2>🔊 Voxtral TTS <span class="gpu">GPU 2 · residente</span></h2>
  <textarea id="tts-text">Hello, this is a test</textarea>
  <select id="tts-voice"><option value="tara">tara</option><option value="neutral_female">neutral_female</option></select>
  <button onclick="speak()">🔊 Hablar</button>
  <div id="tts-result" class="result">Esperando...</div>
  <div id="tts-audio"></div>
</div>

<div class="card">
  <h2>🎬 Wan 2.1 I2V <span class="gpu">GPU 2 · carga y mantiene</span></h2>
  <input type="file" id="i2v-image" accept="image/*">
  <label style="margin-top:4px">Prompt</label>
  <textarea id="i2v-prompt">cinematic zoom in, dramatic lighting</textarea>
  <div class="row">
    <button onclick="generateI2V()" id="btn-i2v">🎬 Generar Video</button>
    <button class="danger" onclick="clearGPU()" id="btn-clear">🗑️ Liberar GPU</button>
  </div>
  <div id="i2v-result" class="result">Sube imagen + prompt...</div>
  <video id="i2v-video" controls style="display:none;width:100%;border-radius:4px;margin-top:4px;max-height:350px;background:#000"></video>
</div>

<div class="card">
  <h2>🎵 AudioLDM2 <span class="gpu">GPU 2 · bajo demanda</span></h2>
  <textarea id="audio-prompt">techno music with a strong beat</textarea>
  <button onclick="genAudio()">🎵 Generar Audio</button>
  <div id="audio-result" class="result">Esperando...</div>
  <div id="audio-player"></div>
</div>

</div>

<script>
const VOX="/api/voxtral",AUDIO="/api/audioldm2",COMFY="/api/comfyui";

// Estado del modelo actual
let currentModel = null; 
let modelLoaded = false;

// Actualizar status cada 5s
function updateStatus(){
  fetch("/api/comfyui/system_stats").then(r=>r.json()).then(d=>{
    document.getElementById("comfy-status").textContent="ok";
    document.getElementById("comfy-status").className="on";
  }).catch(()=>{
    document.getElementById("comfy-status").textContent="off";
    document.getElementById("comfy-status").className="off";
  });
  fetch("/api/gpu2/status").then(r=>r.json()).then(d=>{
    let used=(d.gpu_mem_used_mb/1024).toFixed(1);
    document.getElementById("gpu-mem").textContent=used+"GB";
    document.getElementById("gpu-model").textContent=currentModel||"ninguno";
  }).catch(()=>{});
}
setInterval(updateStatus,5000);
updateStatus();

// ── Voxtral TTS ──
async function speak(){
  let text=document.getElementById("tts-text").value;
  let voice=document.getElementById("tts-voice").value;
  let el=document.getElementById("tts-result");
  if(!text.trim()){el.innerHTML='<span class="error">Escribe texto</span>';return;}
  el.textContent="Generando...";
  try{
    let r=await fetch(VOX+"/v1/audio/speech",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:text,voice:voice,response_format:"wav"})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    let blob=await r.blob();
    let url=URL.createObjectURL(blob);
    document.getElementById("tts-audio").innerHTML='<audio controls src="'+url+'"></audio>';
    el.innerHTML="✅ "+(blob.size/1024).toFixed(0)+" KB";
  }catch(e){el.innerHTML='<span class="error">'+e.message+'</span>';}
}

// ── AudioLDM2 ──
async function genAudio(){
  let prompt=document.getElementById("audio-prompt").value;
  let el=document.getElementById("audio-result");
  if(!prompt.trim()){el.innerHTML='<span class="error">Escribe prompt</span>';return;}
  el.textContent="Generando (30s+)...";
  try{
    // Cargar AudioLDM2 primero
    currentModel="audioldm2";
    let r=await fetch(AUDIO+"/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,num_inference_steps:10,audio_length_in_s:10})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    let blob=await r.blob();
    let url=URL.createObjectURL(blob);
    document.getElementById("audio-player").innerHTML='<audio controls src="'+url+'"></audio>';
    el.innerHTML="✅ "+(blob.size/1024).toFixed(0)+" KB";
    modelLoaded=true;
  }catch(e){el.innerHTML='<span class="error">'+e.message+'</span>';}
}

// ── Liberar GPU ──
async function clearGPU(){
  let btn=document.getElementById("btn-clear");
  btn.disabled=true;
  btn.textContent="Liberando...";
  try{
    let r=await fetch("/api/gpu2/clear",{method:"POST"});
    let d=await r.json();
    currentModel=null;
    modelLoaded=false;
    document.getElementById("i2v-result").innerHTML="✅ GPU liberada. Modelos descargados.";
  }catch(e){
    document.getElementById("i2v-result").innerHTML='<span class="error">Error: '+e.message+'</span>';
  }
  btn.disabled=false;
  btn.textContent="🗑️ Liberar GPU";
  updateStatus();
}

// ── Wan I2V ──
async function generateI2V(){
  let file=document.getElementById("i2v-image").files[0];
  let prompt=document.getElementById("i2v-prompt").value.trim();
  let el=document.getElementById("i2v-result");
  let videoEl=document.getElementById("i2v-video");
  let btn=document.getElementById("btn-i2v");
  if(!file){el.innerHTML='<span class="error">Sube imagen</span>';return;}
  if(!prompt){el.innerHTML='<span class="error">Escribe prompt</span>';return;}

  btn.disabled=true;
  el.textContent="Subiendo imagen...";
  videoEl.style.display="none";

  try{
    // 1. Upload
    let imgForm=new FormData();
    imgForm.append("image",file,file.name);
    let up=await fetch(COMFY+"/upload/image",{method:"POST",body:imgForm});
    if(!up.ok) throw new Error("Upload: "+up.status);
    let ud=JSON.parse(await up.text());
    let imgName=ud.name;
    if(!imgName) throw new Error("Sin nombre");

    // Marcar modelo como Wan
    currentModel="wan";

    // 2. Workflow - SIN force_offload para mantener modelo cargado
    let seed=Math.floor(Math.random()*2147483647);
    let wf={
      "1":{"class_type":"WanVideoModelLoader","inputs":{"model":"wan2.1-i2v-14b-480p-Q3_K_S.gguf","base_precision":"bf16","quantization":"disabled","load_device":"main_device","attention_mode":"sdpa"}},
      "2":{"class_type":"LoadWanVideoT5TextEncoder","inputs":{"model_name":"umt5_xxl_fp16.safetensors","precision":"bf16","load_device":"offload_device"}},
      "3":{"class_type":"WanVideoTextEncode","inputs":{"positive_prompt":prompt,"negative_prompt":"blur,low quality,static","t5":["2",0],"force_offload":true}},
      "4":{"class_type":"WanVideoVAELoader","inputs":{"model_name":"wan_2.1_vae.safetensors","precision":"fp16","load_device":"main_device"}},
      "5":{"class_type":"LoadImage","inputs":{"image":imgName}},
      "6":{"class_type":"WanVideoImageToVideoEncode","inputs":{"vae":["4",0],"start_image":["5",0],"width":320,"height":320,"num_frames":5,"force_offload":true,"noise_aug_strength":0.05,"start_latent_strength":1.0,"end_latent_strength":1.0}},
      "7":{"class_type":"WanVideoSampler","inputs":{"model":["1",0],"image_embeds":["6",0],"text_embeds":["3",0],"steps":6,"cfg":6,"shift":3,"seed":seed,"scheduler":"unipc","riflex_freq_index":0,"force_offload":true}},
      "8":{"class_type":"WanVideoDecode","inputs":{"vae":["4",0],"samples":["7",0],"enable_vae_tiling":true,"tile_x":32,"tile_y":32,"tile_stride_x":16,"tile_stride_y":16}},
       "9":{"class_type":"VHS_VideoCombine","inputs":{"images":["8",0],"frame_rate":4,"loop_count":0,"filename_prefix":"WanOut","format":"video/h264-mp4","pixel_format":"yuv420p","crf":20,"save_metadata":false,"pingpong":false,"save_output":true}}
     };

    let pr=await fetch(COMFY+"/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:wf})});
    let pd=JSON.parse(await pr.text());
    let pid=pd.prompt_id;
    if(!pid) throw new Error("Sin prompt_id");

    el.textContent=(modelLoaded?"✅ Modelo en VRAM, generando...":"⏳ Cargando modelo en VRAM (15-20s la primera vez)...")+" (seed:"+seed+")";
    modelLoaded=true;

    // 3. Poll - más tolerante, hasta 10 min
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,5000));
      try{
        let h=await(await fetch(COMFY+"/history")).json();
        for(let[hpid,entry] of Object.entries(h)){
          if(entry.outputs){
            for(let[nid,out] of Object.entries(entry.outputs)){
              if(out.videos&&out.videos.length>0){
                let vUrl=COMFY+"/view?filename="+out.videos[0].filename+"&subfolder="+(out.videos[0].subfolder||"")+"&type=output";
                videoEl.src=vUrl;
                videoEl.style.display="block";
                el.innerHTML="✅ Video! (modelo se descargó, próxima carga será más rápida)";
                try{let vb=await(await fetch(vUrl)).blob();el.innerHTML="✅ Video ("+(vb.size/1024).toFixed(0)+" KB)";}catch(e){}
                btn.disabled=false;
                updateStatus();
                return;
              }
            }
          }
        }
      }catch(e){}
      let gpuNow=(await(await fetch("/api/gpu2/status")).json()).gpu_mem_used_mb;
      el.textContent="Generando... ("+((i+1)*5)+"s) GPU:"+((gpuNow||0)/1024).toFixed(1)+"GB";
    }
            }
          }
        }
      }catch(e){}
      el.textContent="Generando... ("+((i+1)*5)+"s)";
    }
    el.innerHTML='<span class="error">Timeout</span>';
  }catch(e){
    el.innerHTML='<span class="error">Error: '+e.message+'</span>';
    console.error("I2V:",e);
  }
  btn.disabled=false;
  updateStatus();
}
</script>
</body>
</html>
