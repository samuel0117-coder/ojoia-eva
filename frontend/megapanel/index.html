<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OjoIA Megapanel — Cluster</title>
<!-- Firebase App + Auth + Firestore (compat, v9 via compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--fg:#e6e9ef;--muted:#8b93a3;--g0:#22c55e;--g1:#3b82f6;--g2:#a855f7;--err:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
h1{font-size:20px;margin-bottom:4px}
h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid #2a2e38;border-radius:10px;padding:16px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #262a33}
th{color:var(--muted);font-weight:600;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag.g0{background:rgba(34,197,94,.15);color:var(--g0)}
.tag.g1{background:rgba(59,130,246,.15);color:var(--g1)}
.tag.g2{background:rgba(168,85,247,.15);color:var(--g2)}
.tag.cpu{background:rgba(139,146,163,.15);color:var(--muted)}
.tag.ncbi{background:rgba(245,158,11,.15);color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot-on{background:var(--g0)}
.dot-off{background:var(--err)}
button{background:#262b36;color:var(--fg);border:1px solid #333a47;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
button:hover{background:#313848}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=email],input[type=password],input[type=text],select{padding:7px;border-radius:6px;border:1px solid #333a47;background:#14171c;color:var(--fg)}
.gpu-bar{height:6px;background:#262a33;border-radius:3px;margin-top:6px;overflow:hidden}
.gpu-bar>div{height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-ok{background:rgba(34,197,94,.15);color:var(--g0)}
.badge-err{background:rgba(239,68,68,.15);color:var(--err)}
#login{max-width:360px;margin:60px auto}
.result{background:#0d0f13;border:1px solid #262a33;border-radius:6px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto}
.nodename{font-size:16px;font-weight:700;margin-bottom:2px}
.online{color:var(--g0)} .offline{color:var(--err)}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>🔐 Acceso al Megapanel</h1>
  <p class="muted">Panel centralizado del cluster OjoIA</p>
  <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="doLogin()">Iniciar sesión</button>
    <button onclick="doRegister()" style="background:transparent;color:var(--muted)">Crear cuenta (email)</button>
  </div>
  <div id="authmsg" class="muted" style="margin-top:10px"></div>
</div>

<div id="app" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div>
      <h1>📊 OjoIA Megapanel <span class="muted">— Cluster multi-nodo</span></h1>
      <div class="muted">Firebase: ojoia-67216</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="user-label" class="muted"></span>
      <select id="node-filter" onchange="refreshNodes()">
        <option value="">TODOS los nodos</option>
      </select>
      <button onclick="logout()">Salir</button>
    </div>
  </div>

  <div id="nodes-container"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAtlS7rikClpJBVHM46gPvN4HL_CYyRxP0",
  authDomain: "ojoia-67216.firebaseapp.com",
  projectId: "ojoia-67216",
  storageBucket: "ojoia-67216.firebasestorage.app",
  messagingSenderId: "490868607747",
  appId: "1:490868607747:web:f722468d4f3493deb8f736"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let nodeFilter = '';

function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('password').value;
  const msg=document.getElementById('authmsg');
  try{ await auth.signInWithEmailAndPassword(email,pw); }
  catch(e){ msg.textContent = e.message; }
}
async function doRegister(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('password').value;
  const msg=document.getElementById('authmsg');
  try{ await auth.createUserWithEmailAndPassword(email,pw); }
  catch(e){ msg.textContent = e.message; }
}
function logout(){ auth.signOut(); }

auth.onAuthStateChanged(u=>{
  if(u){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('user-label').textContent = u.email;
    startListener();
  } else {
    document.getElementById('login').style.display='block';
    document.getElementById('app').style.display='none';
  }
});

function gpuTag(g){
  if(g==null||g<0) return '<span class="tag cpu">CPU</span>';
  return `<span class="tag ${g%3==0?'g0':g%3==1?'g1':'g2'}">GPU ${g}</span>`;
}
function nodeTag(nid, cur){
  return `<span class="tag ${nid===cur?'g0':'g1'}">${esc(nid)}</span>`;
}

function startListener(){
  db.collection('nodes').onSnapshot(async snap=>{
    const nodes=[];
    snap.forEach(d=>nodes.push({id:d.id, ...d.data()}));
    nodes.sort((a,b)=>a.id.localeCompare(b.id));
    // Llenar filtro de nodos
    const sel=document.getElementById('node-filter');
    const current=sel.value;
    sel.innerHTML='<option value="">TODOS los nodos</option>'+
      nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.id)}</option>`).join('');
    if(current) sel.value=current;
    renderNodes(nodes);
  });
}

function applyFilter(id){
  return nodeFilter===''||nodeFilter===id;
}

function renderNodes(nodes){
  const container=document.getElementById('nodes-container');
  container.innerHTML = nodes.map(n=>{
    const st=n.status||{};
    const svcs=(st.services||[]).filter(()=>true);
    const gpus=st.gpus||[];
    return applyFilter(n.id) ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
          <div>
            <div class="nodename">${esc(n.id)} ${n.online?'<span class="online">●</span>':'<span class="offline">●</span>'}</div>
            <div class="muted">${esc(n.hostname||st.hostname||'')} · uptime ${Math.floor((st.uptime_s||0)/3600)}h</div>
          </div>
          <span class="muted">actualizado ${ago(n.updated_at)}</span>
        </div>

        <div class="grid">
          <div>
            <h3>🖥️ GPUs (${gpus.length})</h3>
            ${gpus.map(g=>`
              <div style="margin-bottom:8px">
                <div style="display:flex;justify-content:space-between">
                  <span><b>GPU ${g.index}</b> ${esc(g.name)}</span>
                  <span class="muted">${pct(g.mem_pct)} · ${g.util_pct}% util · ${g.temp_c}°C${g.power_w?' · '+g.power_w+'W':''}</span>
                </div>
                <div class="gpu-bar"><div style="width:${g.mem_pct}%;background:${g.mem_pct>90?'var(--err)':g.mem_pct>70?'var(--warn)':'var(--g0)'}"></div></div>
                <div class="muted">${g.mem_used_mb}/${g.mem_total_mb} MB</div>
              </div>`).join('')||'<div class="muted">Sin GPUs</div>'}
            <div style="margin-top:9px;font-size:13px">
              ⚡ <b>${st.power?st.power.total_w+' W':'-'}</b> total
              <span class="muted">· CPU ${st.power&&st.power.cpu_w!=null?st.power.cpu_w+' W':'—'} · GPU ${st.power?st.power.gpu_w:'—'} W</span>
            </div>
          </div>

          <div>
            <h3>⚙️ Servicios (${svcs.length})</h3>
            <table>
              <thead><tr><th>Servicio</th><th>GPU</th><th>Node</th><th>Estado</th><th></th></tr></thead>
              <tbody>
                ${svcs.map(sv=>`
                  <tr>
                    <td>${esc(sv.name)}<div style="color:var(--muted);font-size:11px">${esc(sv.id)}</div></td>
                    <td>${gpuTag(sv.gpu)}</td>
                    <td>${nodeTag(sv.node||n.id, n.id)}</td>
                    <td><span class="dot ${sv.active?'dot-on':'dot-off'}"></span>${sv.active?'OK':'DOWN'}</td>
                    <td style="white-space:nowrap">
                      <button class="s" onclick="runControl('${esc(n.id)}','${esc(sv.id)}','start')">▶</button>
                      <button class="r" onclick="runControl('${esc(n.id)}','${esc(sv.id)}','stop')">■</button>
                      <button onclick="runControl('${esc(n.id)}','${esc(sv.id)}','restart')">↻</button>
                    </td>
                  </tr>`).join('')
                  || '<tr><td colspan="5" class="muted">Sin servicios</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>` : '';
  }).join('');
  // actualizar filtro count
}

function ago(ts){
  if(!ts) return '—';
  const s=ts.seconds?ts.seconds*1000:ts;
  const sec=Math.floor((Date.now()-s)/1000);
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.floor(sec/60)+'m';
  return Math.floor(sec/3600)+'h';
}
function pct(p){ if(p==null) return ''; return '<span class="muted">'+p+'%</span>'; }

function refreshNodes(){
  nodeFilter=document.getElementById('node-filter').value;
  // el listener ya re-renderiza; forzamos re-render con filtro actual
  db.collection('nodes').get().then(snap=>{
    const nodes=[]; snap.forEach(d=>nodes.push({id:d.id,...d.data()}));
    renderNodes(nodes);
  });
}

async function runControl(nodeId, svcId, action){
  if(!window.confirm(`${action} ${svcId} en nodo ${nodeId}?`)) return;
  try{
    const ref = db.collection('control').doc(nodeId).collection('cmds').doc();
    await ref.set({
      service_id: svcId,
      action,
      requested_at: firebase.firestore.FieldValue.serverTimestamp(),
      requested_by: auth.currentUser?auth.currentUser.email:'',
      status:'pending'
    });
  }catch(e){ alert('Error: '+e.message); }
}
</script>
</body>
</html>
