<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" href="favicon.ico">
<title>OjoIA - Tu guardia inteligente</title>
<link rel="stylesheet" href="app.css?v=20260731a">
<style>#app-content{overflow-y:auto;-webkit-overflow-scrolling:touch;}#app-content.eva-page{position:absolute;top:48px;bottom:60px;left:0;right:0;display:flex!important;flex-direction:column!important;height:auto!important;min-height:0!important;padding:0!important;overflow:hidden!important;}#app-content.eva-page>#eva-chat-container{flex:1!important;min-height:0!important;height:100%!important;}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.2);border-radius:2px}::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,0.45)}*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,0.2) transparent}[id^="event-modal-"]{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,0.18) transparent}[id^="event-modal-"]::-webkit-scrollbar{width:5px;height:5px}[id^="event-modal-"]::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.18);border-radius:3px}[id^="event-modal-"]::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,0.4)}</style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="fullscreen">
      <div class="login-container">
        <div class="login-logo">
          <svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg" style="border-radius:16px"><rect width="64" height="64" rx="16" fill="#0a84ff"/><ellipse cx="32" cy="32" rx="26" ry="15" fill="none" stroke="#fff" stroke-width="3"/><circle cx="32" cy="32" r="10" fill="#fff"/><circle cx="32" cy="32" r="5" fill="#0a84ff"/><circle cx="35" cy="29" r="2" fill="#fff"/></svg>
        </div>
        <h1>OjoIA</h1>
        <p class="login-subtitle">Tu guardia inteligente</p>

        <div class="tab-switcher">
          <button class="tab-switch active" id="tab-switch-login" onclick="App.setLoginMode('login')">Entrar</button>
          <button class="tab-switch" id="tab-switch-register" onclick="App.setLoginMode('register')">Registrarse</button>
        </div>

        <div id="reg-fields" style="display:none">
          <div class="input-group"><label>Tu nombre</label><input id="reg-name" type="text" placeholder="Juan Pérez" autocomplete="name"></div>
          <div class="input-group"><label>Nombre del negocio</label><input id="reg-business" type="text" placeholder="Colmado El Buen Precio"></div>
          <div class="input-group"><label>Tipo de negocio</label>
            <select id="reg-biztype">
              <option value="">Selecciona...</option>
              <option value="retail">🏪 Colmado / Tienda</option>
              <option value="pharmacy">💊 Farmacia</option>
              <option value="restaurant">🍽️ Restaurante / Bar</option>
              <option value="agriculture">🌾 Finca / Agricultura</option>
              <option value="warehouse">📦 Almacén / Bodega</option>
              <option value="office">🏢 Oficina</option>
              <option value="service">🔧 Taller / Servicio</option>
              <option value="other">📋 Otro</option>
            </select>
          </div>
        </div>

        <div class="input-group"><label>Correo electrónico</label><input id="login-email" type="email" placeholder="tu@correo.com" autocomplete="email"></div>
        <div class="input-group"><label>Contraseña</label><input id="login-pw" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password"></div>
        <div class="input-group" id="pw2-group" style="display:none"><label>Confirmar contraseña</label><input id="login-pw2" type="password" placeholder="Repite la contraseña" autocomplete="new-password"></div>

        <div class="error" id="login-err"></div>
        <div class="success" id="login-success"></div>
        <button class="btn" id="btn-auth" onclick="App.doLogin()">Entrar</button>
        <p class="login-hint" id="auth-hint">¿Olvidaste tu contraseña? Contacta al administrador.</p>
      </div>
    </div>

<!-- APP SHELL -->
<div id="screen-app" style="display:none">
  <header class="app-header"><span class="header-logo-svg" aria-label="OjoIA" title="OjoIA"><svg viewBox="0 0 64 64" width="32" height="32" xmlns="http://www.w3.org/2000/svg"><ellipse cx="32" cy="32" rx="30" ry="18" fill="none" stroke="#0a84ff" stroke-width="3"/><circle cx="32" cy="32" r="11" fill="#0a84ff"/><circle cx="32" cy="32" r="5" fill="#000"/><circle cx="35" cy="29" r="2" fill="#fff"/></svg></span></header>
  <main id="app-content" class="app-content"></main>
  <nav class="bottom-tabs">
    <button class="tab active" data-page="eva" onclick="App.go('eva')"><span class="tab-icon">💬</span><span class="tab-label">Eva</span></button>
    <button class="tab" data-page="home" onclick="App.go('home')"><span class="tab-icon">📷</span><span class="tab-label">Cámara</span></button>
    <button class="tab" data-page="events" onclick="App.go('events')"><span class="tab-icon">🚨</span><span class="tab-label">Eventos</span></button>
    <button class="tab" data-page="settings" onclick="App.go('settings')"><span class="tab-icon">⚙️</span><span class="tab-label">Ajustes</span></button>
  </nav>
</div>

<div id="viewer-modal" style="display:none">
  <div class="modal-header"><span id="viewer-title" style="font-weight:600">Cámara</span><button class="modal-close" onclick="App.closeViewer()">✕</button></div>
  <div id="viewer-body" style="flex:1;overflow-y:auto;padding:12px"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="app-v12.js?v=20260731a"></script>
    <script src="eva-chat-v5.js?v=20260731a"></script>
</body>
</html>
