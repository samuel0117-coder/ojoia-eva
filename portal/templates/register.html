{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card">
        <h2>Crear Cuenta</h2>
        {% if request.query_params.get('error') == 'exists' %}
            <p class="error">El email ya está registrado</p>
        {% endif %}
        <form method="post" action="/register">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Plan</label>
                <select name="plan">
                    <option value="free">Free - 1M tokens/mes</option>
                </select>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Registrarse</button>
        </form>
        <p style="text-align: center; margin-top: 16px; color: #8b949e;">
            ¿Ya tienes cuenta? <a href="/login" style="color: #58a6ff;">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}
