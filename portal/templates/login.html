{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card">
        <h2>Iniciar Sesión</h2>
        {% if request.query_params.get('error') == 'invalid' %}
            <p class="error">Email o contraseña incorrectos</p>
        {% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Entrar</button>
        </form>
        <p style="text-align: center; margin-top: 16px; color: #8b949e;">
            ¿No tienes cuenta? <a href="/register" style="color: #58a6ff;">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
