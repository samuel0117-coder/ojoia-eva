<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OjoIA - Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #30363d; margin-bottom: 30px; }
        nav h1 { color: #58a6ff; font-size: 24px; }
        nav a { color: #8b949e; text-decoration: none; margin-left: 20px; }
        nav a:hover { color: #58a6ff; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { color: #58a6ff; margin-bottom: 16px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; }
        .stat .value { font-size: 28px; font-weight: bold; color: #3fb950; }
        .stat .label { color: #8b949e; font-size: 14px; margin-top: 4px; }
        .btn { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; text-decoration: none; display: inline-block; }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #30363d; }
        .btn-secondary:hover { background: #484f58; }
        input, textarea, select { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        label { display: block; margin-bottom: 6px; color: #8b949e; }
        .form-group { margin-bottom: 16px; }
        .error { color: #f85149; margin-bottom: 12px; }
        .success { color: #3fb950; margin-bottom: 12px; }
        .model-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #30363d; }
        .model-card:last-child { border-bottom: none; }
        .model-name { font-weight: bold; }
        .model-desc { color: #8b949e; font-size: 14px; }
        .chat-box { height: 400px; overflow-y: auto; background: #0d1117; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .message { margin-bottom: 12px; padding: 12px; border-radius: 8px; }
        .message.user { background: #1f6feb33; }
        .message.assistant { background: #3fb95033; }
        .message .role { font-weight: bold; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <h1>🧠 OjoIA</h1>
            <div>
                {% if user %}
                    <a href="/dashboard">Dashboard</a>
                    <a href="/models">Modelos</a>
                    <a href="/logout">Salir</a>
                {% else %}
                    <a href="/login">Login</a>
                    <a href="/register">Registrarse</a>
                {% endif %}
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
